<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HLS SSAI Ad Cleaner</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 14px;
      --border: rgba(148, 163, 184, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 340px;
      min-height: 220px;
      background: linear-gradient(180deg, var(--bg), #111827 80%);
      color: var(--text);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    .popup {
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .badge {
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      background: rgba(148, 163, 184, 0.15);
      color: var(--muted);
    }

    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
    }

    .segment {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 12px;
      padding: 6px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .segment-option {
      appearance: none;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .segment-option.active {
      background: linear-gradient(180deg, rgba(34, 197, 94, 0.28), rgba(34, 197, 94, 0.14));
      color: #ecfdf5;
      box-shadow: inset 0 0 0 1.5px rgba(34, 197, 94, 0.7), 0 0 0 2px rgba(34, 197, 94, 0.12);
      transform: translateY(-1px);
    }

    .segment-option.global.active {
      background: linear-gradient(180deg, rgba(245, 158, 11, 0.3), rgba(245, 158, 11, 0.14));
      color: #fff7ed;
      box-shadow: inset 0 0 0 1.5px rgba(245, 158, 11, 0.75), 0 0 0 2px rgba(245, 158, 11, 0.15);
      transform: translateY(-1px);
    }

    .segment-option.site.active {
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.25), rgba(239, 68, 68, 0.14));
      color: #fff1f2;
      box-shadow: inset 0 0 0 1.5px rgba(239, 68, 68, 0.75), 0 0 0 2px rgba(239, 68, 68, 0.12);
      transform: translateY(-1px);
    }

    .site-name {
      margin: 0 0 8px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      word-break: break-all;
    }

    .hint {
      font-size: 12px;
      line-height: 1.5;
      color: var(--muted);
      min-height: 34px;
      font-weight: 600;
    }

    .badge.global {
      background: rgba(245, 158, 11, 0.16);
      color: #fcd34d;
    }

    .badge.site {
      background: rgba(239, 68, 68, 0.16);
      color: #fecaca;
    }
  </style>
</head>
<body>
  <div class="popup">
    <div class="header">
      <h1 id="popupTitle">Site control</h1>
      <span id="statusBadge" class="badge">ON</span>
    </div>

    <div class="card">
      <div class="segment" role="tablist" aria-label="Disable mode">
        <button class="segment-option on" data-mode="on" type="button">On</button>
        <button class="segment-option site" data-mode="site" type="button">This site</button>
        <button class="segment-option global" data-mode="global" type="button">Global</button>
      </div>

      <p id="siteName" class="site-name">Current site: -</p>
      <div id="hintText" class="hint">Enabled and will clean HLS ads on this page.</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
